<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KubeCart | Shipping Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="checkout-page">
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="KubeCart home">
          <img src="database/logo.png" alt="KubeCart logo" class="brand-logo" />
          <span>KubeCart</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="products.html">Shop</a>
          <a href="checkout.html">Cart</a>
        </nav>
      </div>
    </header>

    <main class="shipping-main container">
      <section class="shipping-box">
        <span class="eyebrow">Delivery information</span>
        <h1>Shipping details</h1>
        <p>Enter a Nigerian delivery address so we can arrange your order.</p>

        <form class="shipping-form" id="shipping-form">
          <label>
            Full name
            <input type="text" name="fullName" autocomplete="name" required />
          </label>
          <label>
            Nigerian phone number
            <input
              type="tel"
              name="phone"
              placeholder="+234 801 234 5678"
              pattern="\+234[0-9\s-]{10,14}"
              autocomplete="tel"
              required
            />
          </label>
          <label>
            Country
            <input type="text" value="Nigeria" readonly />
          </label>
          <label>
            State
            <select name="state" required>
              <option value="">Select state</option>
              <option>Abia</option>
              <option>Adamawa</option>
              <option>Akwa Ibom</option>
              <option>Anambra</option>
              <option>Bauchi</option>
              <option>Bayelsa</option>
              <option>Benue</option>
              <option>Borno</option>
              <option>Cross River</option>
              <option>Delta</option>
              <option>Ebonyi</option>
              <option>Edo</option>
              <option>Ekiti</option>
              <option>Enugu</option>
              <option>Gombe</option>
              <option>Imo</option>
              <option>Jigawa</option>
              <option>Kaduna</option>
              <option>Kano</option>
              <option>Katsina</option>
              <option>Kebbi</option>
              <option>Kogi</option>
              <option>Kwara</option>
              <option>Lagos</option>
              <option>Nasarawa</option>
              <option>Niger</option>
              <option>Ogun</option>
              <option>Ondo</option>
              <option>Osun</option>
              <option>Oyo</option>
              <option>Plateau</option>
              <option>Rivers</option>
              <option>Sokoto</option>
              <option>Taraba</option>
              <option>Yobe</option>
              <option>Zamfara</option>
              <option>Federal Capital Territory</option>
            </select>
          </label>
          <label>
            City or town
            <input type="text" name="city" autocomplete="address-level2" required />
          </label>
          <label>
            Delivery address
            <textarea name="address" autocomplete="street-address" required></textarea>
          </label>
          <button class="checkout-btn" type="submit">Save shipping details</button>
        </form>
        <p class="shipping-confirmation" id="shipping-confirmation" hidden>
          Shipping details saved for delivery in Nigeria.
        </p>
        <a
          class="checkout-btn order-confirmation-btn"
          id="order-confirmation-link"
          href="order-confirmation.html"
          hidden
        >
          View order confirmation
        </a>
      </section>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KubeCart | Order Confirmation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="checkout-page">
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="KubeCart home">
          <img src="database/logo.png" alt="KubeCart logo" class="brand-logo" />
          <span>KubeCart</span>
        </a>
      </div>
    </header>

    <main class="confirmation-main container">
      <section class="confirmation-box">
        <span class="confirmation-mark" aria-hidden="true">✓</span>
        <span class="eyebrow">Order received</span>
        <h1>Thanks for shopping with us</h1>
        <p>
          Your payment and shipping details have been received. We will verify your order before processing delivery.
        </p>

        <div class="verification-card">
          <span>Order verification number</span>
          <strong>+234 816 726 3662</strong>
        </div>

        <p class="confirmation-note">Contact this number to verify your order placement.</p>
        <a class="checkout-btn confirmation-home-link" href="index.html">Return to KubeCart</a>
      </section>
    </main>
  </body>
</html>
